    function RealMapView({ regionId, category, providers, selectedPin, onSelectPin }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstanceRef.current && window.L) {
          try {
            const map = L.map(mapContainerRef.current, {
              center: [49.75, 15.5],
              zoom: 7,
              zoomControl: true,
              attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19
            }).addTo(map);

            markersLayerRef.current = L.layerGroup().addTo(map);
            mapInstanceRef.current = map;

            setTimeout(() => {
              if (mapInstanceRef.current) {
                mapInstanceRef.current.invalidateSize();
              }
            }, 250);
          } catch (err) {
            console.error("Leaflet initialization error:", err);
          }
        }

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (!mapInstanceRef.current) return;
        const regionObj = ALL_REGIONS.find(r => r.id === regionId) || ALL_REGIONS[0];
        
        if (
          regionObj && 
          Array.isArray(regionObj.center) && 
          regionObj.center.length === 2 &&
          !isNaN(regionObj.center[0]) && 
          !isNaN(regionObj.center[1])
        ) {
          try {
            mapInstanceRef.current.invalidateSize();
            const targetZoom = typeof regionObj.zoom === 'number' && !isNaN(regionObj.zoom) ? regionObj.zoom : 8;
            mapInstanceRef.current.setView(regionObj.center, targetZoom, {
              animate: true
            });
          } catch (err) {
            console.warn("Chyba při posunu mapy:", err);
          }
        }
      }, [regionId]);

      useEffect(() => {
        if (!mapInstanceRef.current || !markersLayerRef.current || !window.L) return;
        markersLayerRef.current.clearLayers();

        const filtered = providers.filter(p => category === 'vse' || p.brand === category);

        filtered.forEach(p => {
          if (typeof p.lat !== 'number' || typeof p.lng !== 'number' || isNaN(p.lat) || isNaN(p.lng)) {
            return;
          }
          const isSelected = selectedPin?.id === p.id;

          const customIcon = L.divIcon({
            className: 'custom-leaflet-marker',
            html: `
              <div class="custom-marker-pin flex flex-col items-center cursor-pointer transform -translate-x-1/2 -translate-y-full">
                <div class="relative">
                  <div class="w-11 h-11 rounded-2xl p-0.5 ${isSelected ? 'bg-amber-400 ring-4 ring-amber-300' : 'bg-emerald-600 ring-2 ring-white'} shadow-xl overflow-hidden">
                    <img src="${p.avatar}" class="w-full h-full object-cover rounded-xl" />
                  </div>
                  <div class="w-2.5 h-2.5 bg-slate-900 rotate-45 mx-auto -mt-1 shadow-sm"></div>
                </div>
                <div class="bg-slate-950/90 text-white font-black text-[9px] px-2 py-0.5 rounded-md shadow-md mt-0.5 whitespace-nowrap border border-white/20">
                  ${p.name.split(' ')[0]} • ${p.priceDisplay}
                </div>
              </div>
            `,
            iconSize: [44, 60],
            iconAnchor: [22, 55]
          });

          const marker = L.marker([p.lat, p.lng], { icon: customIcon });
          marker.on('click', () => {
            onSelectPin(p);
          });
          markersLayerRef.current.addLayer(marker);
        });
      }, [providers, category, selectedPin]);

      return (
        <div ref={mapContainerRef} className="w-full h-full min-h-[380px] bg-slate-100 relative z-10" />
      );
    }

                </div>

                <form onSubmit={async e=>{
                  e.preventDefault();if(!currentUser){triggerToast("Přihlaste se.");return;}
                  if(uploadedFiles.length){triggerToast("Fotografie zatím nelze uložit. Odeberte je.");return;}
                  const f=e.currentTarget,title=f.title.value.trim(),city=f.location.value.trim(),description=f.desc.value.trim();
                  let error;
                  if(listingModalType==="poptavka"){
                    const c=await db.from("categories").select("id").eq("slug","ostatni").limit(1);
                    if(c.error||!c.data?.length){triggerToast("Kategorie není dostupná.");return;}
                    ({error}=await db.from("wanted_listings").insert({buyer_id:currentUser.id,title,description,city,category_id:c.data[0].id,max_price:Number(f.budget?.value||0),currency:"CZK",status:"active"}));
                  }else{
                    if(!f.price?.value){triggerToast("Vyplňte cenu.");return;}
                    ({error}=await db.from("listings").insert({seller_id:currentUser.id,title,description,city,category:BRANDS[listingModalBrand]?.name||"Ostatní",price:Number(f.price.value),currency:"CZK",status:"published"}));
                  }
                  if(error){triggerToast("Uložení selhalo: "+error.message);return;}
                  await loadListings();setShowNewListingModal(false);setUploadedFiles([]);triggerToast("Uloženo do databáze.");
                }} className="space-y-4 text-xs font-semibold">

                  <div>
                    <label className="text-slate-700 font-bold block mb-1.5">Kategorie / Služba:</label>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                      {(listingModalType === 'poptavka' ? demandBrands : offerBrands).map(b => (
                        <button key={b.id} type="button" onClick={() => setListingModalBrand(b.id)} className={`p-2.5 rounded-xl border text-left transition-all cursor-pointer flex flex-col justify-between ${listingModalBrand === b.id ? 'bg-slate-900 text-white border-slate-900 shadow-sm ring-2 ring-red-400' : 'bg-slate-50 hover:bg-white border-slate-200 text-slate-700'}`}>
                          <span className="font-extrabold text-[11px] truncate block">{b.name}</span>
                          <span className={`text-[10px] truncate ${listingModalBrand === b.id ? 'text-slate-300' : 'text-slate-400'}`}>{b.badge}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-700 font-bold block mb-1">{listingModalType === 'poptavka' ? 'Co přesně hledáte / poptáváte?' : 'Název nabízené věci / výrobku'}</label>
                    <input required name="title" type="text" placeholder="Výstižný název..." className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm font-medium focus:border-red-500 focus:bg-white transition-all" />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-700 font-bold block mb-1">Lokalita (Město / Region)</label>
                      <input required name="location" type="text" defaultValue={currentUser?.location || "Brno a okolí"} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none text-sm font-medium focus:border-red-500 focus:bg-white" />
                    </div>
                    <div>
                      <label className="text-slate-700 font-bold block mb-1">{listingModalType === 'poptavka' ? 'Orientační rozpočet v Kč (volitelné)' : 'Cena v Kč'}</label>
                      <input name={listingModalType === 'poptavka' ? "budget" : "price"} type="number" placeholder="Např. 500" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none text-sm font-medium focus:border-red-500 focus:bg-white" />
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-white border-2 border-dashed border-slate-300">
                    <div className="flex items-center justify-between mb-1">
                      <div className="flex items-center space-x-2 text-slate-900 font-extrabold text-xs">
                        <UploadCloud className="w-4 h-4 text-slate-700" />
                        <span>{listingModalType === 'poptavka' ? 'Vlastní fotografie věci (zcela volitelné)' : 'Nahrát vlastní fotografie z mobilu či PC'}</span>
                      </div>
                    </div>
                    <div className="flex flex-wrap items-center gap-2 mt-2">
                      <label className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold cursor-pointer transition-colors flex items-center space-x-1.5 border border-slate-300">
                        <Camera className="w-3.5 h-3.5 text-slate-600" />
                        <span>+ {uploadedFiles.length > 0 ? `Vybráno (${uploadedFiles.length})` : 'Vybrat vlastní fotku'}</span>
                        <input type="file" multiple accept="image/*" className="hidden" onChange={(e) => {
                          const files = Array.from(e.target.files).map(f => ({ name: f.name, preview: URL.createObjectURL(f) }));
                          setUploadedFiles(files);
                          triggerToast(`Vybráno ${files.length} fotografií`);
                        }} />
                      </label>
                      {uploadedFiles.length > 0 && (
                        <button type="button" onClick={() => setUploadedFiles([])} className="px-3 py-2 text-red-600 hover:bg-red-50 rounded-xl text-xs font-bold">Odebrat foto</button>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-700 font-bold block mb-1">Podrobnosti a popis</label>
                    <textarea required name="desc" rows={3} placeholder="Uveďte parametry, stav, potřeby nebo termíny..." className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none text-sm font-medium focus:border-red-500 focus:bg-white" />
                  </div>

                  <div className="pt-3 flex items-center justify-between border-t border-slate-100">
                    <button type="button" onClick={() => setShowNewListingModal(false)} className="px-4 py-2 text-slate-500 font-bold cursor-pointer">Zrušit</button>
                    <button type="submit" className={`px-6 py-2.5 rounded-xl font-bold text-white text-xs sm:text-sm shadow-md transition-all cursor-pointer ${listingModalType === 'poptavka' ? 'bg-red-600 hover:bg-red-700' : 'bg-slate-900 hover:bg-slate-800'}`}>
                      {listingModalType === 'poptavka' ? 'Zveřejnit poptávku' : 'Uložit nabídku'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showSeniorModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-amber-200 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-6">
                  <div className="flex items-center space-x-3">
                    <div className="w-11 h-11 rounded-2xl bg-amber-500 text-slate-950 font-black text-sm flex items-center justify-center shadow-md">60+</div>
                    <div>
                      <span className="text-[11px] font-black uppercase tracking-wider text-amber-700 bg-amber-100 px-2 py-0.5 rounded">Věkově vymezená služba</span>
                      <h3 className="text-xl font-black text-slate-900 mt-1">Seniorská podpora NEMAM.TO</h3>
                    </div>
                  </div>
                  <button onClick={() => setShowSeniorModal(false)} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 cursor-pointer">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <div className="space-y-4 text-slate-700 text-sm">
                  <div className="p-4 rounded-2xl bg-amber-50/80 border border-amber-200">
                    <h4 className="font-extrabold text-slate-900 text-sm mb-1">Nevíte si rady s webem nebo hledáním pomoci?</h4>
                    <p className="text-xs text-slate-600 leading-relaxed">Tato bezplatná asistence je určena pro seniory <strong>60+</strong> a jejich rodiny, kterým rádi pomůžeme krok za krokem.</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div className="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs flex flex-col justify-between">
                      <div>
                        <div className="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center mb-3"><MessageSquare className="w-4 h-4" /></div>
                        <h5 className="font-black text-sm text-slate-900 mb-1">Napsat nám na chat</h5>
                        <p className="text-xs text-slate-500 mb-4">Odpovíme vám přímo v systému jednoduchou formou.</p>
                      </div>
                      <button onClick={() => { setShowSeniorModal(false); requireAuth(() => setShowChatModal(true)); }} className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs cursor-pointer">
                        Otevřít chat podpory
                      </button>
                    </div>
                    <div className="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs flex flex-col justify-between">
                      <div>
                        <div className="w-8 h-8 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center mb-3 font-black text-xs">📞</div>
                        <h5 className="font-black text-sm text-slate-900 mb-1">Zavolat na podporu</h5>
                        <p className="text-xs text-slate-500 mb-4">Lidský hlas na telefonu, který vás vším provede.</p>
                      </div>
                      <a href="tel:800123456" className="block text-center py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl text-xs">800 123 456 (Bezplatně)</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showChatModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
              <div className="bg-white rounded-3xl max-w-4xl w-full h-[640px] shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center text-white"><MessageSquare className="w-5 h-5" /></div>
                    <div><h3 className="font-black text-base">Centrální zprávy vašeho účtu</h3><p className="text-xs text-slate-400">Přímá komunikace napříč celou sítí</p></div>
                  </div>
                  <button onClick={() => setShowChatModal(false)} className="text-slate-400 hover:text-white p-1 cursor-pointer"><X className="w-5 h-5" /></button>
                </div>
                <div className="flex-1 flex overflow-hidden">
                  <div className="w-2/5 min-w-[280px] border-r border-slate-200 bg-[#FAF8F5] flex flex-col overflow-y-auto">
                    <div className="p-3.5 border-b border-slate-200 bg-white sticky top-0 z-10 flex items-center justify-between">
                      <span className="text-[11px] font-black uppercase text-slate-400 tracking-wider">Konverzace ({conversations.length})</span>
                    </div>
                    <div className="divide-y divide-slate-100">
                      {conversations.map(conv => (
                        <div key={conv.id} onClick={() => setSelectedConvId(conv.id)} className={`p-3.5 cursor-pointer transition-colors flex items-start space-x-3 border-l-4 ${conv.id === selectedConvId ? 'bg-white shadow-xs' : 'hover:bg-slate-100/70 border-l-transparent'}`}>
                          <img src={conv.counterpart.avatar} alt={conv.counterpart.name} className="w-10 h-10 rounded-full object-cover border shrink-0" />
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center justify-between mb-1">
                              <span className="font-extrabold text-xs text-slate-900 truncate">{conv.counterpart.name}</span>
                              <span className="text-[10px] text-slate-400">{conv.lastTime}</span>
                            </div>
                            <p className="text-[11px] text-slate-700 truncate font-bold mb-0.5">{conv.itemTitle}</p>
                            <p className="text-[11px] text-slate-400 truncate">{conv.lastMessage}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="flex-1 flex flex-col bg-white">
                    <div className="px-5 py-3 border-b flex flex-wrap items-center justify-between gap-3" style={{ backgroundColor: `${activeConvBrand.themeColor}12` }}>
                      <div className="flex items-center space-x-3">
                        <img src={activeConversation.counterpart.avatar} alt={activeConversation.counterpart.name} className="w-9 h-9 rounded-full object-cover border" />
                        <div>
                          <div className="flex items-center space-x-2">
                            <h4 className="font-black text-xs text-slate-900">{activeConversation.counterpart.name}</h4>
                            <span className="text-[10px] font-black px-2 py-0.5 rounded text-white" style={{ backgroundColor: activeConvBrand.themeColor }}>{activeConvBrand.name}</span>
                          </div>
                          <span className="text-[11px] text-slate-600 block">Předmět: <strong>{activeConversation.itemTitle}</strong></span>
                        </div>
                      </div>
                      <div>
                        {activeConversation.hasRated ? (
                          <span className="inline-flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 text-xs font-bold border border-emerald-300">
                            <CheckCircle className="w-3.5 h-3.5 text-emerald-600" />
                            <span>Spolupráce ohodnocena (5★)</span>
                          </span>
                        ) : (
                          <button onClick={() => setShowRatingModal(true)} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl text-xs shadow-sm flex items-center space-x-1.5 cursor-pointer">
                            <Star className="w-3.5 h-3.5 fill-current" />
                            <span>Dokončit & Ohodnotit</span>
                          </button>
                        )}
                      </div>
                    </div>
                    <div className="flex-1 p-5 overflow-y-auto space-y-3 bg-[#FAF8F5]">
                      {activeConversation.messages.map(m => (
                        <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[75%] p-3.5 rounded-2xl text-xs ${m.sender === 'user' ? 'text-white rounded-br-none shadow-sm' : 'bg-white text-slate-800 border rounded-bl-none shadow-sm'}`} style={{ backgroundColor: m.sender === 'user' ? activeConvBrand.themeColor : undefined }}>
                            <p className="leading-relaxed">{m.text}</p>
                            <span className={`text-[9px] block text-right mt-1 ${m.sender === 'user' ? 'text-white/80' : 'text-slate-400'}`}>{m.time}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="p-3 border-t border-slate-200 bg-white flex items-center space-x-2">
                      <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()} placeholder={`Napište zprávu k poptávce...`} className="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 text-xs outline-none" />
                      <button onClick={handleSendMessage} className="text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow-sm flex items-center space-x-1.5 cursor-pointer" style={{ backgroundColor: activeConvBrand.themeColor }}>
                        <span>Odeslat</span><Send className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeDetailItem && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center space-x-2 mb-6 pb-4 border-b border-slate-100">
                  <span className={`px-2.5 py-1 rounded-md text-[10px] font-black uppercase text-white ${BRANDS[activeDetailItem.brand].primaryBg}`}>
                    {BRANDS[activeDetailItem.brand].name}
                  </span>
                  <span className="text-xs text-slate-400 font-bold">• ID: {activeDetailItem.id}</span>
                  <button onClick={() => setActiveDetailItem(null)} className="text-slate-400 hover:text-slate-600 cursor-pointer ml-auto"><X className="w-5 h-5" /></button>
                </div>
                <div className="space-y-6">
                  {activeDetailItem.image ? (
                    <div className="h-64 rounded-2xl overflow-hidden bg-slate-100 relative">
                      <img src={activeDetailItem.image} alt={activeDetailItem.title} className="w-full h-full object-cover" />
                      {activeDetailItem.mediaNote && (
                        <div className="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-xs text-white px-3 py-1 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-md">
                          <Camera className="w-3.5 h-3.5" />
                          <span>{activeDetailItem.mediaNote}</span>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="p-6 bg-gradient-to-r from-blue-50 to-indigo-50/50 rounded-2xl border border-blue-100 flex items-center space-x-3">
                      <div className="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-bold"><Search className="w-6 h-6" /></div>
                      <div>
                        <span className="text-xs font-bold text-blue-800 uppercase tracking-wider block">Textová poptávka bez fotografie</span>
                        <p className="text-xs text-slate-600">Tento inzerát hledá věc či službu a nemá přiloženou fotografii.</p>
                      </div>
                    </div>
                  )}

                  <div>
                    <h3 className="text-2xl font-black text-slate-900 mb-2">{activeDetailItem.title}</h3>
                    <div className="flex flex-wrap items-center gap-4 text-xs text-slate-500 font-medium mb-4">
                      <span className="flex items-center"><MapPin className="w-3.5 h-3.5 mr-1 text-slate-400" /> {activeDetailItem.location}</span>
                      <span className="flex items-center"><Calendar className="w-3.5 h-3.5 mr-1 text-slate-400" /> Vloženo: {activeDetailItem.createdAt}</span>
                      <span className="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-bold">Stav: {activeDetailItem.status}</span>
                    </div>
                    <p className="text-slate-700 text-sm leading-relaxed whitespace-pre-line bg-slate-50 p-4 rounded-2xl border border-slate-100">
                      {activeDetailItem.desc}
                    </p>
                  </div>

                  <div className="pt-4 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div>
                      <span className="text-xs text-slate-400 block font-semibold">Cenové podmínky:</span>
                      <span className="text-2xl font-black text-slate-900">{activeDetailItem.priceDisplay}</span>
                      {activeDetailItem.depositDisplay && <span className="text-xs text-slate-500 block mt-0.5">{activeDetailItem.depositDisplay}</span>}
                    </div>
                    <button onClick={() => { requireAuth(() => { setActiveDetailItem(null); setShowChatModal(true); }); }} className="w-full sm:w-auto px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition-colors flex items-center justify-center space-x-2 cursor-pointer shadow-md">
                      <MessageSquare className="w-4 h-4" />
                      <span>Napsat zprávu & domluvit se</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
